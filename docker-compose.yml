services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalpi}
      POSTGRES_DB: ${POSTGRES_DB:-kalpi}
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the DB is reachable as db:5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kalpi}:${POSTGRES_PASSWORD:-kalpi}@db:5432/${POSTGRES_DB:-kalpi}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pg-data:
